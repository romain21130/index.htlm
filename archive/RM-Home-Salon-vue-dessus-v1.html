<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RM Home — Salon vue du dessus v1</title>
<style>
:root{--bg:#070c13;--card:#111923;--text:#eef5ff;--muted:#8fa0b5;--cy:#49c8ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070c13}}
:root[data-theme="dark"]{--bg:#070c13}
*{box-sizing:border-box}
body{margin:0;padding:14px;background:radial-gradient(circle at 70% 5%,#111a2d,#070c13 60%);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.h{max-width:640px;margin:0 auto 10px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.b{font-size:11px;letter-spacing:.19em;color:#8fb3d3;font-weight:800}h1{margin:5px 0 0;font-size:22px}
.n{font-size:12px;color:var(--muted);text-align:right}
.c{max-width:640px;margin:auto;background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:20px;padding:10px}
svg{display:block;width:100%;height:auto;max-height:88vh;margin:auto;border-radius:14px;background:#0a1018}
.lamp{cursor:pointer}.halo{opacity:0;transition:opacity .35s}.lamp.on .halo{opacity:1}
.bulb{fill:#7d7050}.lamp.on .bulb{fill:#ffe2a0}
</style></head><body>
<div class="h"><div><div class="b">RM HOME / SALON</div><h1>Vue du dessus — 9,77 × 4,10 m</h1></div>
<div class="n">Géométrie v16 • 1 m = 100 unités<br>Démo locale : touche une lampe</div></div>
<div class="c">
<svg viewBox="-28 -28 466 1033" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Salon vu du dessus">
<defs>
<pattern id="tile" width="45" height="45" patternUnits="userSpaceOnUse"><rect width="45" height="45" fill="#6f6c69"/><path d="M0 0H45V45" fill="none" stroke="#5d5a57" stroke-width="1.2"/></pattern><pattern id="pebble" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#cfc4ae"/><circle cx="4" cy="4" r="3.2" fill="#e3dac8"/><circle cx="11" cy="8" r="3" fill="#bdb198"/><circle cx="5" cy="11" r="2.6" fill="#d9cfba"/></pattern>
<pattern id="wood" width="100" height="26" patternUnits="userSpaceOnUse"><rect width="100" height="26" fill="#c08a4a"/><path d="M0 25H100" stroke="#9c6d38" stroke-width="1"/></pattern>
<pattern id="plaid" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#ddd2c2"/><path d="M0 7H14M7 0V14" stroke="#b9a58a" stroke-width="4" opacity=".55"/><path d="M0 0H14M0 0V14" stroke="#fff" stroke-width="1.5" opacity=".7"/></pattern>
<radialGradient id="ga"><stop class="s" offset="0" stop-color="#ffc878" stop-opacity=".55"/><stop class="s" offset="1" stop-color="#ffc878" stop-opacity="0"/></radialGradient>
<radialGradient id="gb"><stop class="s" offset="0" stop-color="#ffc878" stop-opacity=".55"/><stop class="s" offset="1" stop-color="#ffc878" stop-opacity="0"/></radialGradient>
<radialGradient id="gt"><stop class="s" offset="0" stop-color="#ffc878" stop-opacity=".6"/><stop class="s" offset="1" stop-color="#ffc878" stop-opacity="0"/></radialGradient>
</defs>

<!-- SOL + MURS (v16) -->
<rect width="410" height="977" fill="url(#tile)"/>
<rect x="0" y="0" width="410" height="977" fill="none" stroke="#263343" stroke-width="12"/>
<!-- ouvertures v16 : arches couloir (gauche) + passage cuisine (droite) -->
<rect x="-8" y="282" width="16" height="124" fill="url(#pebble)"/>
<rect x="-8" y="746" width="16" height="88" fill="url(#pebble)"/>
<rect x="402" y="564" width="16" height="127" fill="#e9e6e1"/>

<!-- habillage pierre côté poêle -->
<rect x="6" y="482" width="5" height="110" fill="#3a3835"/>

<!-- meuble TV + TV -->
<rect x="8" y="75" width="42" height="195" rx="2" fill="#1f1d1c" stroke="#d8b88a" stroke-width="2"/>
<rect x="14" y="90" width="6" height="108" fill="#0e1014"/>
<circle cx="36" cy="228" r="11" fill="#3c7d3a"/><circle cx="78" cy="26" r="11" fill="#3c7d3a"/>
<rect x="100" y="8" width="55" height="10" fill="#b58a55"/>

<!-- malle (droite, alignée au mur) -->
<rect x="10" y="422" width="50" height="95" rx="2" fill="#5a3524"/><rect x="14" y="442" width="42" height="57" fill="#d9d4c6"/>
<!-- poêle -->
<circle cx="42" cy="546" r="27" fill="#efe9dd" stroke="#2a2a2a" stroke-width="2"/><circle cx="42" cy="546" r="19" fill="none" stroke="#c9c1b0" stroke-width="2"/><circle cx="36" cy="546" r="9" fill="#1b1b1b"/>
<!-- tonneau + plante -->
<circle cx="40" cy="936" r="31" fill="#dcb98a" stroke="#3a2a1a" stroke-width="3"/><circle cx="40" cy="936" r="14" fill="#2f3437"/><g fill="#4b7a3a"><ellipse cx="40" cy="936" rx="5" ry="20"/><ellipse cx="40" cy="936" rx="5" ry="20" transform="rotate(60 40 936)"/><ellipse cx="40" cy="936" rx="5" ry="20" transform="rotate(120 40 936)"/></g>

<!-- canapé en L + chaise longue avec plaid -->
<path d="M195 6H380V295H292V101H195Z" fill="#8d8b88" stroke="#6b6967" stroke-width="2"/>
<rect x="125" y="6" width="70" height="95" fill="#8d8b88" stroke="#6b6967" stroke-width="2"/>
<rect x="131" y="12" width="58" height="83" fill="url(#plaid)"/>
<rect x="235" y="14" width="34" height="26" rx="4" fill="#a49f97"/><rect x="343" y="120" width="26" height="34" rx="4" fill="#a49f97"/>
<!-- table basse -->
<rect x="195" y="150" width="82" height="100" fill="url(#wood)" stroke="#5e4022" stroke-width="3"/>
<rect x="212" y="170" width="22" height="26" fill="#7d2f3a"/><rect x="212" y="205" width="22" height="26" fill="#7d2f3a"/>

<!-- petit meuble + buffet/vaisselier -->
<rect x="384" y="255" width="24" height="60" fill="#d8c9a8" stroke="#a89670"/>
<rect x="358" y="318" width="50" height="217" fill="#b8804a" stroke="#5e4022" stroke-width="2"/>
<rect x="388" y="330" width="20" height="170" fill="#c99a62" stroke="#7a5630"/>
<circle cx="380" cy="410" r="11" fill="#3c7d3a"/><circle cx="392" cy="510" r="12" fill="#3c7d3a"/>

<!-- table à manger + centre + chaises -->
<rect x="155" y="545" width="100" height="210" fill="url(#wood)" stroke="#5e4022" stroke-width="3"/>
<circle cx="205" cy="640" r="14" fill="#3c7d3a"/><circle cx="188" cy="655" r="7" fill="#8a8a88"/><circle cx="208" cy="665" r="7" fill="#8a8a88"/>
<g fill="#b28d58" stroke="#6e5530" stroke-width="2">
<rect x="104" y="560" width="46" height="46" rx="9"/><rect x="104" y="630" width="46" height="46" rx="9"/><rect x="104" y="700" width="46" height="46" rx="9"/>
<rect x="260" y="560" width="46" height="46" rx="9"/><rect x="260" y="630" width="46" height="46" rx="9"/><rect x="260" y="700" width="46" height="46" rx="9"/>
<rect x="182" y="497" width="46" height="44" rx="9"/><rect x="182" y="760" width="46" height="44" rx="9"/></g>

<!-- bureau informatique -->
<rect x="342" y="815" width="66" height="150" fill="url(#wood)" stroke="#5e4022" stroke-width="3"/>
<rect x="396" y="878" width="7" height="50" fill="#1d6fd6"/><rect x="352" y="880" width="14" height="42" rx="2" fill="#1f2226"/>
<rect x="392" y="942" width="14" height="16" fill="#9a9c9f"/><circle cx="392" cy="830" r="11" fill="#3c7d3a"/>
<rect x="284" y="866" width="50" height="54" rx="14" fill="#1d222c"/>

<!-- ÉCLAIRAGES — 3 zones séparées (overlays dynamiques, entités = placeholders) -->
<g id="lamp-a" class="lamp" data-ha="planned" data-entity="PLACEHOLDER_light_salon_cage_1" transform="translate(205 190)">
<circle class="halo" r="170" fill="url(#ga)"/><rect x="-9" y="-13" width="18" height="26" rx="3" fill="none" stroke="#111" stroke-width="2"/><circle class="bulb" r="4.5"/><circle r="30" fill="transparent"/></g>
<g id="lamp-b" class="lamp" data-ha="planned" data-entity="PLACEHOLDER_light_salon_cage_2" transform="translate(205 410)">
<circle class="halo" r="170" fill="url(#gb)"/><rect x="-9" y="-13" width="18" height="26" rx="3" fill="none" stroke="#111" stroke-width="2"/><circle class="bulb" r="4.5"/><circle r="30" fill="transparent"/></g>
<g id="lamp-table" class="lamp" data-ha="planned" data-entity="PLACEHOLDER_light_salon_table" transform="translate(205 650)">
<circle class="halo" r="230" fill="url(#gt)"/><rect x="-46" y="-12" width="92" height="24" fill="none" stroke="#111" stroke-width="2.5"/><circle class="bulb" cx="-28" r="5"/><circle class="bulb" r="5"/><circle class="bulb" cx="28" r="5"/><circle r="52" fill="transparent"/></g>
<g id="applique-gauche"><rect x="6" y="443" width="11" height="24" rx="5" fill="#b9bcc0" stroke="#7d8084"/></g>
</svg></div>
<script>
// API pour Home Assistant : RM.setLight('lamp-table', true, 0.8, [255,200,120])
window.RM={setLight:function(id,on,br,rgb){var g=document.getElementById(id);if(!g)return;g.classList.toggle('on',!!on);var h=g.querySelector('.halo');h.style.opacity=on?(br==null?1:br):0;
if(rgb){g.querySelectorAll('.s').length||0;var gr=document.querySelector(h.getAttribute('fill').slice(4,-1));gr.querySelectorAll('.s').forEach(function(s){s.setAttribute('stop-color','rgb('+rgb.join(',')+')')})}}};
document.querySelectorAll('.lamp').forEach(function(g){g.addEventListener('click',function(){g.classList.toggle('on');g.querySelector('.halo').style.opacity=''})});
</script>
</body></html>
