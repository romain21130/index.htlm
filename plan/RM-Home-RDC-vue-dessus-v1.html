html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070c13}}
:root[data-theme="dark"]{--bg:#070c13}
*{box-sizing:border-box}
body{margin:0;padding:14px;background:radial-gradient(circle at 70% 5%,#111a2d,#070c13 60%);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.h{max-width:1100px;margin:0 auto 10px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}

.n{font-size:12px;color:var(--muted);text-align:right}
.c{max-width:1100px;margin:auto;background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:20px;padding:10px}
svg{display:block;width:100%;height:auto;max-height:88vh;margin:auto;border-radius:14px;background:#0a1018}
.lamp{cursor:pointer}.halo{opacity:0;transition:opacity .35s}.lamp.on .halo{opacity:1}
.bulb{fill:#7d7050}.lamp.on .bulb{fill:#ffe2a0}
.spot{fill:#f4f4f2}.lamp.on .spot{fill:#ffe9a8}
.shoe{transition:transform .9s cubic-bezier(.34,1.56,.64,1)}
#shoeA{transform:translate(296px,72px) rotate(-28deg)}#shoeB{transform:translate(324px,94px) rotate(37deg)}
#egg-shoes.tidy #shoeA{transform:translate(200px,24px) rotate(0deg)}#egg-shoes.tidy #shoeB{transform:translate(200px,42px) rotate(0deg)}
#egg-shoes .cap{opacity:0;transition:opacity .5s;font:600 7px system-ui,sans-serif;fill:#e6d9c4}#egg-shoes.tidy .cap{opacity:.85}
