<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RM Home — Véranda vue du dessus v1</title>
<style>
:root{--bg:#070c13;--card:#111923;--text:#eef5ff;--muted:#8fa0b5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070c13}}
:root[data-theme="dark"]{--bg:#070c13}
*{box-sizing:border-box}
body{margin:0;padding:14px;background:radial-gradient(circle at 70% 5%,#111a2d,#070c13 60%);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.h{max-width:900px;margin:0 auto 10px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.b{font-size:11px;letter-spacing:.19em;color:#8fb3d3;font-weight:800}h1{margin:5px 0 0;font-size:22px}
.n{font-size:12px;color:var(--muted);text-align:right}
.c{max-width:900px;margin:auto;background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:20px;padding:10px}
svg{display:block;width:100%;height:auto;max-height:88vh;margin:auto;border-radius:14px;background:#0a1018}
.lamp{cursor:pointer}.halo{opacity:0;transition:opacity .35s}.lamp.on .halo{opacity:1}.spot{fill:#f4f4f2}.lamp.on .spot{fill:#ffe9a8}
.bulb{fill:#7d7050}.lamp.on .bulb{fill:#ffe2a0}
.shoe{transition:transform .9s cubic-bezier(.34,1.56,.64,1)}
#shoeA{transform:translate(296px,72px) rotate(-28deg)}#shoeB{transform:translate(324px,94px) rotate(37deg)}
#egg-shoes.tidy #shoeA{transform:translate(200px,24px) rotate(0deg)}#egg-shoes.tidy #shoeB{transform:translate(200px,42px) rotate(0deg)}
#egg-shoes .cap{opacity:0;transition:opacity .5s;font:600 7px system-ui,sans-serif;fill:#e6d9c4}#egg-shoes.tidy .cap{opacity:.85}
</style></head><body>
<div class="h"><div><div class="b">RM HOME / VÉRANDA</div><h1>Vue du dessus — 4,15 × 1,46 m</h1></div>
<div class="n">Géométrie v16 • nord en haut<br>Positions estimées d'après 3 photos</div></div>
<div class="c">
<svg viewBox="-28 -28 471 202" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Véranda vue du dessus"><defs>
<pattern id="lam" width="120" height="38" patternUnits="userSpaceOnUse"><rect width="120" height="38" fill="#d9ac7c"/><rect y="19" width="120" height="19" fill="#d3a473"/><path d="M0 0H120M0 19H120M40 0V19M100 19V38" stroke="#b98a5c" stroke-width=".8"/></pattern>
<pattern id="stp" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#cfa46e"/><path d="M0 0H20M0 10H20" stroke="#a97c4a" stroke-width=".8"/></pattern>
<clipPath id="cv"><rect x="6" y="6" width="403" height="134"/></clipPath>
<radialGradient id="gv" gradientUnits="userSpaceOnUse" cx="267" cy="6" r="85"><stop class="s" offset="0" stop-color="#ffd9a0" stop-opacity=".55"/><stop class="s" offset="1" stop-color="#ffd9a0" stop-opacity="0"/></radialGradient>
<radialGradient id="vigV" gradientUnits="userSpaceOnUse" cx="207" cy="73" r="230"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".22"/></radialGradient>
<filter id="shV" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".3"/></filter>
</defs><!-- SOL + MURS (v16 : 415 × 146) -->
<rect width="415" height="146" fill="url(#lam)"/>
<rect width="415" height="146" fill="none" stroke="#263343" stroke-width="12"/><rect x="6" y="6" width="403" height="134" fill="none" stroke="#000" stroke-opacity=".18" stroke-width="8"/>
<!-- porte cuisine (v16) + porte extérieure côté est (photos, absente du v16) -->
<rect x="315" y="-8" width="80" height="16" fill="#cfa46e"/><rect x="315" y="-3" width="80" height="6" fill="#eceae6" stroke="#b8b6b0" stroke-width=".6"/>
<rect x="407" y="45" width="16" height="80" fill="#8a8378"/><rect x="412" y="45" width="6" height="80" fill="#eceae6" stroke="#b8b6b0" stroke-width=".6"/>
<g filter="url(#shV)">
<rect x="309" y="6" width="92" height="24" fill="url(#stp)" stroke="#a97c4a"/>
<rect x="125" y="6" width="150" height="70" rx="2" fill="#1f2226" stroke="#0e1012"/>
<rect x="6" y="52" width="30" height="72" rx="2" fill="#d6b27a" stroke="#a88448"/>
<g id="egg-shoes"><rect x="276" y="48" width="72" height="66" fill="transparent"/><g id="shoeA" class="shoe"><path d="M-15 0C-15-6-8-6.5-2-5.5C5-4.5 12-3.5 15-3V3C12 3.5 5 4.5-2 5.5C-8 6.5-15 6-15 0Z" fill="#f4f4f2" stroke="#8f8f8b" stroke-width=".9"/><path d="M-12.5 0C-12.5-4-7-4.5-2-3.8C4-3 9-2.5 11-2.2V2.2C9 2.5 4 3 -2 3.8C-7 4.5-12.5 4-12.5 0Z" fill="#c3c9d0"/><path d="M-2-3.5V3.5M2-3.5V3.5M6-3.5V3.5" stroke="#9aa0a6" stroke-width=".8"/><rect x="10" y="-2.5" width="4" height="5" rx="1.5" fill="#b9bec4"/></g><g id="shoeB" class="shoe"><path d="M-15 0C-15-6-8-6.5-2-5.5C5-4.5 12-3.5 15-3V3C12 3.5 5 4.5-2 5.5C-8 6.5-15 6-15 0Z" fill="#f4f4f2" stroke="#8f8f8b" stroke-width=".9"/><path d="M-12.5 0C-12.5-4-7-4.5-2-3.8C4-3 9-2.5 11-2.2V2.2C9 2.5 4 3 -2 3.8C-7 4.5-12.5 4-12.5 0Z" fill="#c3c9d0"/><path d="M-2-3.5V3.5M2-3.5V3.5M6-3.5V3.5" stroke="#9aa0a6" stroke-width=".8"/><rect x="10" y="-2.5" width="4" height="5" rx="1.5" fill="#b9bec4"/></g><text class="cap" text-anchor="middle"><tspan x="200" y="58">Encore Ellie qui a laissé</tspan><tspan x="200" y="67">traîner ses godasses</tspan></text></g>
</g>
<rect width="415" height="146" fill="url(#vigV)" pointer-events="none"/>
<!-- applique double spot, mur cuisine, à l'ouest de la porte -->
<g id="lamp-veranda-applique" class="lamp" data-ha="planned" data-entity="PLACEHOLDER_light_veranda_applique"><path class="halo" d="M182 6A85 85 0 0 0 352 6Z" fill="url(#gv)" clip-path="url(#cv)"/><rect x="250" y="6" width="34" height="5" fill="#2a2d31"/><circle class="bulb" cx="258" cy="16" r="6" stroke="#1c1e22" stroke-width="2"/><circle class="bulb" cx="276" cy="16" r="6" stroke="#1c1e22" stroke-width="2"/><rect x="242" y="0" width="50" height="34" fill="transparent"/></g>
</svg></div>
<script>
window.RM=window.RM||{};
window.RM.setLight=function(id,on,br,rgb){var g=document.getElementById(id);if(!g)return;g.classList.toggle('on',!!on);g.querySelectorAll('.halo').forEach(function(h){h.style.opacity=on?(br==null?'':br):'';if(rgb){var m=/#[\w-]+/.exec(h.getAttribute('fill'));document.querySelectorAll(m[0]+' .s').forEach(function(s){s.setAttribute('stop-color','rgb('+rgb.join(',')+')')})}})};
document.querySelectorAll('.lamp').forEach(function(g){g.addEventListener('click',function(){g.classList.toggle('on');g.querySelectorAll('.halo').forEach(function(h){h.style.opacity=''})})});
</script><script>(function(){var g=document.getElementById('egg-shoes'),t;if(!g)return;g.addEventListener('click',function(){clearTimeout(t);g.classList.add('tidy');t=setTimeout(function(){g.classList.remove('tidy')},5000)})})();</script></body></html>
