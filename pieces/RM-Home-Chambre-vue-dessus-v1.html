<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RM Home — Chambre vue du dessus v1</title>
<style>
:root{--bg:#070c13;--card:#111923;--text:#eef5ff;--muted:#8fa0b5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070c13}}
:root[data-theme="dark"]{--bg:#070c13}
*{box-sizing:border-box}
body{margin:0;padding:14px;background:radial-gradient(circle at 70% 5%,#111a2d,#070c13 60%);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.h{max-width:560px;margin:0 auto 10px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.b{font-size:11px;letter-spacing:.19em;color:#8fb3d3;font-weight:800}h1{margin:5px 0 0;font-size:22px}
.n{font-size:12px;color:var(--muted);text-align:right}
.c{max-width:560px;margin:auto;background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:20px;padding:10px}
svg{display:block;width:100%;height:auto;max-height:88vh;margin:auto;border-radius:14px;background:#0a1018}
.lamp{cursor:pointer}.halo{opacity:0;transition:opacity .35s}.lamp.on .halo{opacity:1}.spot{fill:#f4f4f2}.lamp.on .spot{fill:#ffe9a8}
.bulb{fill:#7d7050}.lamp.on .bulb{fill:#ffe2a0}
</style></head><body>
<div class="h"><div><div class="b">RM HOME / CHAMBRE</div><h1>Chambre Mathilde / Romain — 3,43 × 4,76 m</h1></div>
<div class="n">Géométrie v16 • nord en haut<br>Positions estimées d'après 4 photos</div></div>
<div class="c">
<svg viewBox="-28 -28 399 532" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Chambre vue du dessus"><defs>
<pattern id="gl" width="120" height="38" patternUnits="userSpaceOnUse"><rect width="120" height="38" fill="#85817d"/><rect y="19" width="120" height="19" fill="#7d7975"/><path d="M0 0H120M0 19H120M40 0V19M100 19V38" stroke="#6b6864" stroke-width=".8"/></pattern>
<clipPath id="cch"><rect x="6" y="6" width="331" height="464"/></clipPath>
<radialGradient id="gCe"><stop class="s" offset="0" stop-color="#ffd9a0" stop-opacity=".5"/><stop class="s" offset="1" stop-color="#ffd9a0" stop-opacity="0"/></radialGradient>
<radialGradient id="gCn" gradientUnits="userSpaceOnUse" cx="6" cy="190" r="75"><stop class="s" offset="0" stop-color="#ffc878" stop-opacity=".55"/><stop class="s" offset="1" stop-color="#ffc878" stop-opacity="0"/></radialGradient>
<radialGradient id="gCs" gradientUnits="userSpaceOnUse" cx="6" cy="340" r="75"><stop class="s" offset="0" stop-color="#ffc878" stop-opacity=".55"/><stop class="s" offset="1" stop-color="#ffc878" stop-opacity="0"/></radialGradient>
<radialGradient id="vigCh" gradientUnits="userSpaceOnUse" cx="171" cy="238" r="300"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".25"/></radialGradient>
<filter id="shC2" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="2" dy="4" stdDeviation="3.5" flood-color="#000" flood-opacity=".32"/></filter>
</defs><!-- SOL + MURS (v16 : 343 × 476) -->
<rect width="343" height="476" fill="url(#gl)"/>
<rect width="343" height="476" fill="none" stroke="#263343" stroke-width="12"/><rect x="6" y="6" width="331" height="464" fill="none" stroke="#000" stroke-opacity=".2" stroke-width="8"/>
<!-- porte du couloir (v16), fermée -->
<rect x="335" y="249" width="16" height="80" fill="#58504b"/><rect x="340" y="249" width="6" height="80" fill="#3a3d42"/>
<g filter="url(#shC2)">
<rect x="216" y="185" width="74" height="160" rx="2" fill="#d8ceb8" stroke="#bfb49b"/>
<rect x="6" y="63" width="331" height="6" fill="#d9ccb4" stroke="#b8a98e"/>
<circle cx="26" cy="422" r="18" fill="#dcc192" opacity=".85"/><circle cx="26" cy="422" r="8" fill="#c8b48e"/>
<rect x="293" y="350" width="44" height="80" rx="2" fill="#d7b27a" stroke="#a88448"/><path d="M296 350V430" stroke="#efece6" stroke-width="2"/>
<rect x="10" y="175" width="204" height="180" rx="2" fill="#c99a5b" stroke="#a3743f"/>
<rect x="34" y="177" width="180" height="176" rx="6" fill="#f1efec" stroke="#d3cfc8"/>
<rect x="12" y="188" width="40" height="66" rx="8" fill="#f4f2ef" stroke="#c9c5be"/><rect x="12" y="276" width="40" height="66" rx="8" fill="#f4f2ef" stroke="#c9c5be"/>
<rect x="46" y="224" width="26" height="34" rx="5" fill="#d9a9a6"/><rect x="46" y="266" width="26" height="34" rx="5" fill="#d9a9a6"/>
<rect x="4" y="170" width="7" height="190" fill="#d8b47a" stroke="#a88448"/>
<rect x="6" y="135" width="40" height="40" rx="2" fill="#d6b078" stroke="#a88448"/><rect x="6" y="355" width="40" height="40" rx="2" fill="#d6b078" stroke="#a88448"/>
</g>
<rect width="343" height="476" fill="url(#vigCh)" pointer-events="none"/>
<!-- plafond : disque bois + 3 spots ; tête de lit : 2 spots muraux -->
<circle cx="171" cy="240" r="45" fill="#b58a52" fill-opacity=".16" stroke="#b58a52" stroke-opacity=".7" stroke-width="3"/>
<g id="lamp-chambre-plafond" class="lamp" data-ha="planned" data-entity="PLACEHOLDER_light_chambre_plafond"><circle class="halo" cx="148" cy="240" r="85" fill="url(#gCe)" clip-path="url(#cch)"/><circle class="halo" cx="171" cy="240" r="85" fill="url(#gCe)" clip-path="url(#cch)"/><circle class="halo" cx="194" cy="240" r="85" fill="url(#gCe)" clip-path="url(#cch)"/><circle class="spot" cx="148" cy="240" r="5" stroke="#9aa0a6" stroke-width="1.2"/><circle class="spot" cx="171" cy="240" r="5" stroke="#9aa0a6" stroke-width="1.2"/><circle class="spot" cx="194" cy="240" r="5" stroke="#9aa0a6" stroke-width="1.2"/><rect x="118" y="200" width="106" height="80" fill="transparent"/></g>
<g id="lamp-chambre-tete-nord" class="lamp" data-ha="planned" data-entity="PLACEHOLDER_light_chambre_tete_de_lit_nord"><path class="halo" d="M6 115A75 75 0 0 1 6 265Z" fill="url(#gCn)" clip-path="url(#cch)"/><rect x="3" y="182" width="9" height="16" rx="4" fill="#b9bcc0" stroke="#7d8084"/><circle class="bulb" cx="7.5" cy="190" r="3"/><circle cx="8" cy="190" r="24" fill="transparent"/></g>
<g id="lamp-chambre-tete-sud" class="lamp" data-ha="planned" data-entity="PLACEHOLDER_light_chambre_tete_de_lit_sud"><path class="halo" d="M6 265A75 75 0 0 1 6 415Z" fill="url(#gCs)" clip-path="url(#cch)"/><rect x="3" y="332" width="9" height="16" rx="4" fill="#b9bcc0" stroke="#7d8084"/><circle class="bulb" cx="7.5" cy="340" r="3"/><circle cx="8" cy="340" r="24" fill="transparent"/></g>
</svg></div>
<script>
window.RM=window.RM||{};
window.RM.setLight=function(id,on,br,rgb){var g=document.getElementById(id);if(!g)return;g.classList.toggle('on',!!on);g.querySelectorAll('.halo').forEach(function(h){h.style.opacity=on?(br==null?'':br):'';if(rgb){var m=/#[\w-]+/.exec(h.getAttribute('fill'));document.querySelectorAll(m[0]+' .s').forEach(function(s){s.setAttribute('stop-color','rgb('+rgb.join(',')+')')})}})};
document.querySelectorAll('.lamp').forEach(function(g){g.addEventListener('click',function(){g.classList.toggle('on');g.querySelectorAll('.halo').forEach(function(h){h.style.opacity=''})})});
</script></body></html>
