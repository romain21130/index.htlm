<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RM Home — WC vue du dessus v1</title>
<style>
:root{--bg:#070c13;--card:#111923;--text:#eef5ff;--muted:#8fa0b5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070c13}}
:root[data-theme="dark"]{--bg:#070c13}
*{box-sizing:border-box}
body{margin:0;padding:14px;background:radial-gradient(circle at 70% 5%,#111a2d,#070c13 60%);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.h{max-width:560px;margin:0 auto 10px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.b{font-size:11px;letter-spacing:.19em;color:#8fb3d3;font-weight:800}h1{margin:5px 0 0;font-size:22px}
.n{font-size:12px;color:var(--muted);text-align:right}
.c{max-width:560px;margin:auto;background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:20px;padding:10px}
svg{display:block;width:100%;height:auto;max-height:88vh;margin:auto;border-radius:14px;background:#0a1018}
.lamp{cursor:pointer}.halo{opacity:0;transition:opacity .35s}.lamp.on .halo{opacity:1}.spot{fill:#f4f4f2}.lamp.on .spot{fill:#ffe9a8}
.bulb{fill:#7d7050}.lamp.on .bulb{fill:#ffe2a0}
</style></head><body>
<div class="h"><div><div class="b">RM HOME / WC</div><h1>WC — 1,49 × 0,97 m</h1></div>
<div class="n">Géométrie v16 • nord en haut<br>Positions estimées d'après 1 photo</div></div>
<div class="c">
<svg viewBox="-28 -28 205 153" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="WC vue du dessus"><defs>
<pattern id="wt" width="45" height="45" patternUnits="userSpaceOnUse"><rect width="45" height="45" fill="#8f9195"/><path d="M0 0H45M0 0V45" stroke="#a9abaf" stroke-width="1.2"/></pattern>
<clipPath id="cw"><rect x="6" y="6" width="137" height="85"/></clipPath>
<radialGradient id="gW"><stop class="s" offset="0" stop-color="#ffe2b0" stop-opacity=".6"/><stop class="s" offset="1" stop-color="#ffe2b0" stop-opacity="0"/></radialGradient>
<radialGradient id="vigW" gradientUnits="userSpaceOnUse" cx="75" cy="48" r="100"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".25"/></radialGradient>
<filter id="shW" x="-5%" y="-8%" width="110%" height="116%"><feDropShadow dx="1.5" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".32"/></filter>
</defs><!-- SOL + MURS (v16 : 149 × 97) -->
<rect width="149" height="97" fill="url(#wt)"/>
<rect width="149" height="97" fill="none" stroke="#263343" stroke-width="12"/><rect x="6" y="6" width="137" height="85" fill="none" stroke="#000" stroke-opacity=".2" stroke-width="8"/>
<!-- porte du couloir (v16), fermée -->
<rect x="141" y="16" width="16" height="64" fill="#58504b"/><rect x="146" y="16" width="6" height="64" fill="#3a3d42"/>
<g filter="url(#shW)">
<rect x="6" y="31" width="20" height="35" rx="3" fill="#eeeeec" stroke="#b9bcc0"/>
<rect x="24" y="30" width="52" height="37" rx="18" fill="#f2f2f0" stroke="#b9bcc0"/>
<rect x="28" y="32" width="46" height="33" rx="16" fill="none" stroke="#c9a46a" stroke-width="5"/>
<ellipse cx="53" cy="48.5" rx="14" ry="10" fill="#d9dde0"/>
<rect x="24" y="33" width="4" height="31" fill="#1c1e22"/>
<rect x="92" y="58" width="38" height="33" rx="10" fill="#f4f4f2" stroke="#b9bcc0"/><ellipse cx="111" cy="76" rx="13" ry="10" fill="#e6e8ea" stroke="#c9ccd0"/><circle cx="111" cy="86" r="2.5" fill="#8f959b"/>
<circle cx="82" cy="78" r="8" fill="#2a2d31" stroke="#8a6a3a" stroke-width="2"/>
<rect x="8" y="12" width="10" height="10" fill="#c9a46a" stroke="#a88448"/>
</g>
<rect width="149" height="97" fill="url(#vigW)" pointer-events="none"/>
<!-- point lumineux plafond -->
<g id="lamp-wc" class="lamp" data-ha="planned" data-entity="PLACEHOLDER_light_wc"><circle class="halo" cx="72" cy="48" r="70" fill="url(#gW)" clip-path="url(#cw)"/><circle class="spot" cx="72" cy="48" r="5" stroke="#9aa0a6" stroke-width="1.2"/><circle cx="72" cy="48" r="24" fill="transparent"/></g>
</svg></div>
<script>
window.RM=window.RM||{};
window.RM.setLight=function(id,on,br,rgb){var g=document.getElementById(id);if(!g)return;g.classList.toggle('on',!!on);g.querySelectorAll('.halo').forEach(function(h){h.style.opacity=on?(br==null?'':br):'';if(rgb){var m=/#[\w-]+/.exec(h.getAttribute('fill'));document.querySelectorAll(m[0]+' .s').forEach(function(s){s.setAttribute('stop-color','rgb('+rgb.join(',')+')')})}})};
document.querySelectorAll('.lamp').forEach(function(g){g.addEventListener('click',function(){g.classList.toggle('on');g.querySelectorAll('.halo').forEach(function(h){h.style.opacity=''})})});
</script></body></html>
