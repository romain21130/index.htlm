<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RM Home — Salle de bain vue du dessus v1</title>
<style>
:root{--bg:#070c13;--card:#111923;--text:#eef5ff;--muted:#8fa0b5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070c13}}
:root[data-theme="dark"]{--bg:#070c13}
*{box-sizing:border-box}
body{margin:0;padding:14px;background:radial-gradient(circle at 70% 5%,#111a2d,#070c13 60%);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.h{max-width:560px;margin:0 auto 10px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.b{font-size:11px;letter-spacing:.19em;color:#8fb3d3;font-weight:800}h1{margin:5px 0 0;font-size:22px}
.n{font-size:12px;color:var(--muted);text-align:right}
.c{max-width:560px;margin:auto;background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:20px;padding:10px}
svg{display:block;width:100%;height:auto;max-height:88vh;margin:auto;border-radius:14px;background:#0a1018}
.lamp{cursor:pointer}.halo{opacity:0;transition:opacity .35s}.lamp.on .halo{opacity:1}.spot{fill:#f4f4f2}.lamp.on .spot{fill:#ffe9a8}
.bulb{fill:#7d7050}.lamp.on .bulb{fill:#ffe2a0}
</style></head><body>
<div class="h"><div><div class="b">RM HOME / SALLE DE BAIN</div><h1>Salle de bain — 2,11 × 2,56 m</h1></div>
<div class="n">Géométrie v16 • nord en haut<br>Positions estimées d'après 3 photos</div></div>
<div class="c">
<svg viewBox="-28 -28 267 312" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Salle de bain vue du dessus"><defs>
<pattern id="sbt" width="45" height="45" patternUnits="userSpaceOnUse"><rect width="45" height="45" fill="#8f9195"/><path d="M0 0H45M0 0V45" stroke="#a9abaf" stroke-width="1.2"/></pattern>
<pattern id="sbo" width="40" height="120" patternUnits="userSpaceOnUse"><rect width="40" height="120" fill="#d6a869"/><path d="M0 0V120M20 0V120" stroke="#b9884a" stroke-width="1"/></pattern>
<clipPath id="csb"><path clip-rule="evenodd" d="M6 6H205V250H6Z M6 6H98V101H6Z"/></clipPath>
<clipPath id="csd"><rect x="6" y="6" width="92" height="95"/></clipPath>
<radialGradient id="gSB"><stop class="s" offset="0" stop-color="#ffe2b0" stop-opacity=".6"/><stop class="s" offset="1" stop-color="#ffe2b0" stop-opacity="0"/></radialGradient>
<radialGradient id="gSD"><stop class="s" offset="0" stop-color="#ffe2b0" stop-opacity=".6"/><stop class="s" offset="1" stop-color="#ffe2b0" stop-opacity="0"/></radialGradient>
<radialGradient id="vigSB" gradientUnits="userSpaceOnUse" cx="105" cy="128" r="190"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".25"/></radialGradient>
<filter id="shSB" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".32"/></filter>
</defs><!-- SOL + MURS (v16 : 211 × 256) -->
<rect width="211" height="256" fill="url(#sbt)"/>
<rect width="211" height="256" fill="none" stroke="#263343" stroke-width="12"/><rect x="6" y="6" width="199" height="244" fill="none" stroke="#000" stroke-opacity=".2" stroke-width="8"/>
<!-- porte du couloir (centrée comme dans le couloir), fermée -->
<rect x="127" y="248" width="60" height="16" fill="#58504b"/><rect x="127" y="253" width="60" height="6" fill="#3a3d42"/>
<g filter="url(#shSB)">
<rect x="6" y="11" width="92" height="90" fill="#f2f2f0" stroke="#c9ccd0"/><circle cx="52" cy="56" r="4" fill="#b9bcc0"/>
<path d="M98 11V101H6" stroke="#8fc5d6" stroke-width="3" stroke-opacity=".8" fill="none"/><path d="M98 40V62" stroke="#c9ced3" stroke-width="2.5"/>
<rect x="6" y="101" width="40" height="34" fill="#5a4c4f" stroke="#3a3033"/>
<rect x="6" y="135" width="50" height="80" rx="2" fill="#f4f4f2" stroke="#c9ccd0"/><ellipse cx="30" cy="175" rx="16" ry="28" fill="#e6e8ea" stroke="#c9ccd0"/><circle cx="12" cy="175" r="2.5" fill="#8f959b"/>
<rect x="6" y="215" width="40" height="34" fill="#5a4c4f" stroke="#3a3033"/>
<rect x="111.5" y="6" width="80" height="44" rx="2" fill="url(#sbo)" stroke="#7a5630"/>
<rect x="195" y="97" width="10" height="62" rx="2" fill="#f4f4f2" stroke="#c9ccd0"/><path d="M195 107H205M195 117H205M195 127H205M195 137H205M195 147H205" stroke="#c9ccd0" stroke-width=".8"/>
<rect x="58" y="140" width="50" height="72" rx="8" fill="#35383d"/>
</g>
<rect width="211" height="256" fill="url(#vigSB)" pointer-events="none"/>
<g id="lamp-sdb-douche" class="lamp" data-ha="planned" data-entity="PLACEHOLDER_light_sdb_douche"><circle class="halo" cx="52" cy="56" r="60" fill="url(#gSD)" clip-path="url(#csd)"/><circle class="spot" cx="52" cy="56" r="5" stroke="#9aa0a6" stroke-width="1.2"/><circle cx="52" cy="56" r="18" fill="transparent"/></g>
<g id="lamp-sdb-plafond" class="lamp" data-ha="planned" data-entity="PLACEHOLDER_light_sdb_plafond"><circle class="halo" cx="159" cy="56" r="70" fill="url(#gSB)" clip-path="url(#csb)"/><circle class="halo" cx="52" cy="163" r="70" fill="url(#gSB)" clip-path="url(#csb)"/><circle class="halo" cx="159" cy="163" r="70" fill="url(#gSB)" clip-path="url(#csb)"/><circle class="spot" cx="159" cy="56" r="5" stroke="#9aa0a6" stroke-width="1.2"/><circle cx="159" cy="56" r="18" fill="transparent"/><circle class="spot" cx="52" cy="163" r="5" stroke="#9aa0a6" stroke-width="1.2"/><circle cx="52" cy="163" r="18" fill="transparent"/><circle class="spot" cx="159" cy="163" r="5" stroke="#9aa0a6" stroke-width="1.2"/><circle cx="159" cy="163" r="18" fill="transparent"/></g>
</svg></div>
<script>
window.RM=window.RM||{};
window.RM.setLight=function(id,on,br,rgb){var g=document.getElementById(id);if(!g)return;g.classList.toggle('on',!!on);g.querySelectorAll('.halo').forEach(function(h){h.style.opacity=on?(br==null?'':br):'';if(rgb){var m=/#[\w-]+/.exec(h.getAttribute('fill'));document.querySelectorAll(m[0]+' .s').forEach(function(s){s.setAttribute('stop-color','rgb('+rgb.join(',')+')')})}})};
document.querySelectorAll('.lamp').forEach(function(g){g.addEventListener('click',function(){g.classList.toggle('on');g.querySelectorAll('.halo').forEach(function(h){h.style.opacity=''})})});
</script></body></html>
