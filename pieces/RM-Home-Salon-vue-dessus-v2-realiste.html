<script>
window.RM=window.RM||{};
window.RM.setLight=function(id,on,br,rgb){var g=document.getElementById(id);if(!g)return;g.classList.toggle('on',!!on);g.querySelectorAll('.halo').forEach(function(h){h.style.opacity=on?(br==null?'':br):'';if(rgb){var m=/#[\w-]+/.exec(h.getAttribute('fill'));document.querySelectorAll(m[0]+' .s').forEach(function(s){s.setAttribute('stop-color','rgb('+rgb.join(',')+')')})}})};
document.querySelectorAll('.lamp').forEach(function(g){g.addEventListener('click',function(){g.classList.toggle('on');g.querySelectorAll('.halo').forEach(function(h){h.style.opacity=''})})});
</script>
