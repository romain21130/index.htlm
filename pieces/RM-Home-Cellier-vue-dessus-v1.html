<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RM Home — Cellier vue du dessus v1</title>
<style>
:root{--bg:#070c13;--card:#111923;--text:#eef5ff;--muted:#8fa0b5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070c13}}
:root[data-theme="dark"]{--bg:#070c13}
*{box-sizing:border-box}
body{margin:0;padding:14px;background:radial-gradient(circle at 70% 5%,#111a2d,#070c13 60%);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.h{max-width:560px;margin:0 auto 10px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.b{font-size:11px;letter-spacing:.19em;color:#8fb3d3;font-weight:800}h1{margin:5px 0 0;font-size:22px}
.n{font-size:12px;color:var(--muted);text-align:right}
.c{max-width:560px;margin:auto;background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:20px;padding:10px}
svg{display:block;width:100%;height:auto;max-height:88vh;margin:auto;border-radius:14px;background:#0a1018}
.lamp{cursor:pointer}.halo{opacity:0;transition:opacity .35s}.lamp.on .halo{opacity:1}.spot{fill:#f4f4f2}.lamp.on .spot{fill:#ffe9a8}
</style></head><body>
<div class="h"><div><div class="b">RM HOME / CELLIER</div><h1>Vue du dessus — 4,24 × 3,20 m</h1></div>
<div class="n">Géométrie v16 • nord en haut<br>Positions estimées d'après 6 photos</div></div>
<div class="c">
<svg viewBox="-28 -28 376 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cellier vue du dessus"><defs>
<pattern id="cl" width="45" height="45" patternUnits="userSpaceOnUse"><rect width="45" height="45" fill="#b9bbbe"/><path d="M0 0H45M0 0V45" stroke="#a2a5a9" stroke-width="1.2"/></pattern>
<pattern id="cd" width="45" height="45" patternUnits="userSpaceOnUse"><rect width="45" height="45" fill="#7c716a"/><path d="M0 0H45M0 0V45" stroke="#6a5f59" stroke-width="1.2"/></pattern>
<pattern id="pg" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#d9bb7c"/><circle cx="4" cy="4" r="1.6" fill="#8a5f2e"/></pattern>
<pattern id="bt" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="#3b3129"/><circle cx="4.5" cy="4.5" r="3.2" fill="#1d1712"/></pattern>
<radialGradient id="vigC" gradientUnits="userSpaceOnUse" cx="160" cy="212" r="270"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".25"/></radialGradient>
<filter id="shC" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="2" dy="4" stdDeviation="3.5" flood-color="#000" flood-opacity=".3"/></filter>
<clipPath id="cm"><path d="M6 6H314V274H214V418H6Z"/></clipPath><clipPath id="cr"><rect x="220" y="286" width="94" height="132"/></clipPath><radialGradient id="gm"><stop class="s" offset="0" stop-color="#ffd9a0" stop-opacity=".55"/><stop class="s" offset="1" stop-color="#ffd9a0" stop-opacity="0"/></radialGradient><radialGradient id="gr"><stop class="s" offset="0" stop-color="#ffd9a0" stop-opacity=".55"/><stop class="s" offset="1" stop-color="#ffd9a0" stop-opacity="0"/></radialGradient></defs><!-- SOL + MURS (v16 : 320 × 424) -->
<rect width="320" height="424" fill="url(#cl)"/>
<rect x="90" y="90" width="135" height="184" fill="url(#cd)"/>
<rect width="320" height="424" fill="none" stroke="#263343" stroke-width="12"/><rect x="6" y="6" width="308" height="412" fill="none" stroke="#000" stroke-opacity=".2" stroke-width="8"/>
<!-- renfoncement (v16 : 106 × 144, ouverture 80 cm sur son mur nord) -->
<rect x="214" y="280" width="106" height="144" fill="url(#cl)" stroke="#263343" stroke-width="12"/>
<rect x="227" y="272" width="80" height="16" fill="#b9bbbe"/>
<!-- porte grise vers la cuisine (photos, absente du v16) -->
<rect x="120" y="416" width="90" height="16" fill="#d8dde2"/><rect x="120" y="421" width="90" height="6" fill="#3a3d42"/>
<g filter="url(#shC)">
<!-- mur ouest, du nord au sud : casier, cave à pointes, bibliothèques, penderie ; chaussures au mur sud -->
<rect x="6" y="28" width="35" height="90" rx="2" fill="url(#bt)" stroke="#2a221b"/>
<rect x="6" y="118" width="30" height="70" fill="url(#pg)" stroke="#8a5f2e"/>
<rect x="6" y="188" width="40" height="50" fill="#d9bb7c" stroke="#a88448"/><rect x="6" y="238" width="40" height="50" fill="#d9bb7c" stroke="#a88448"/>
<rect x="6" y="288" width="44" height="58" rx="6" fill="#3f3b3e"/>
<rect x="30" y="383" width="70" height="35" fill="#d9c39a" stroke="#a88f62"/><rect x="34" y="387" width="62" height="26" fill="#9aa0a4"/>
<!-- mur nord : buffet, Kallax, tabouret -->
<rect x="45" y="6" width="94" height="50" rx="2" fill="#5a3a26" stroke="#3a2416"/><rect x="50" y="11" width="84" height="40" fill="#6b4530"/>
<rect x="139" y="6" width="80" height="39" fill="#e2c98f" stroke="#b39a5e"/><path d="M179 6V45M139 25.5H219" stroke="#b39a5e" stroke-width="1.5"/>

<!-- mur est : congélateur, frigo, lave-linge + sèche-linge -->
<rect x="249" y="16" width="65" height="130" rx="2" fill="#f3f3f1" stroke="#c2c2be"/><rect x="247" y="70" width="2.5" height="16" rx="1" fill="#8f959b"/>
<rect x="254" y="146" width="60" height="60" rx="2" fill="#f3f3f1" stroke="#c2c2be"/><rect x="252" y="160" width="2.5" height="30" rx="1" fill="#8f959b"/>
<rect x="254" y="206" width="60" height="60" rx="2" fill="#f6f6f4" stroke="#c2c2be"/><rect x="259" y="211" width="50" height="50" rx="2" fill="none" stroke="#dcdcd8"/>
<!-- renfoncement : cumulus, armoire, coffre, seau -->
<rect x="220" y="286" width="6" height="132" fill="#c9a271"/>
<circle cx="272" cy="392" r="24" fill="#f2f3f4" stroke="#b9bcc0"/><circle cx="272" cy="392" r="18" fill="none" stroke="#d5d8db"/>
<rect x="284" y="300" width="30" height="45" fill="#f4f4f2" stroke="#c2c2be"/>
<rect x="224" y="330" width="36" height="36" rx="2" fill="#5b1f1f" stroke="#2a2a2a"/><circle cx="242" cy="306" r="11" fill="#2a2d31"/>
</g>
<rect width="320" height="424" fill="url(#vigC)" pointer-events="none"/>
<g id="lamp-cellier-1" class="lamp" data-ha="planned" data-entity="PLACEHOLDER_light_cellier_1"><circle class="halo" cx="148" cy="179" r="160" fill="url(#gm)" clip-path="url(#cm)"/><circle class="spot" cx="148" cy="179" r="6" stroke="#9aa0a6" stroke-width="1.5"/><circle cx="148" cy="179" r="24" fill="transparent"/></g>
<g id="lamp-cellier-2" class="lamp" data-ha="planned" data-entity="PLACEHOLDER_light_cellier_2"><circle class="halo" cx="270" cy="319" r="80" fill="url(#gr)" clip-path="url(#cr)"/><circle class="spot" cx="270" cy="319" r="5" stroke="#9aa0a6" stroke-width="1.5"/><circle cx="270" cy="319" r="20" fill="transparent"/></g>
</svg></div>
<script>
window.RM=window.RM||{};window.RM.setLight=function(id,on,br,rgb){var g=document.getElementById(id);if(!g)return;g.classList.toggle('on',!!on);var h=g.querySelector('.halo');h.style.opacity=on?(br==null?1:br):'';if(rgb){document.querySelectorAll(h.getAttribute('fill').slice(4,-1)+' .s').forEach(function(s){s.setAttribute('stop-color','rgb('+rgb.join(',')+')')})}};
document.querySelectorAll('.lamp').forEach(function(g){g.addEventListener('click',function(){g.classList.toggle('on');g.querySelector('.halo').style.opacity=''})});
</script></body></html>
