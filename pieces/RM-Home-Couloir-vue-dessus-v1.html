<!doctype html>

<style>
:root{--bg:#070c13;--card:#111923;--text:#eef5ff;--muted:#8fa0b5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070c13}}
:root[data-theme="dark"]{--bg:#070c13}
*{box-sizing:border-box}
body{margin:0;padding:14px;background:radial-gradient(circle at 70% 5%,#111a2d,#070c13 60%);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.h{max-width:420px;margin:0 auto 10px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}

.n{font-size:12px;color:var(--muted);text-align:right}
.c{max-width:420px;margin:auto;background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:20px;padding:10px}
svg{display:block;width:100%;height:auto;max-height:88vh;margin:auto;border-radius:14px;background:#0a1018}
.lamp{cursor:pointer}.halo{opacity:0;transition:opacity .35s}.lamp.on .halo{opacity:1}.spot{fill:#f4f4f2}.lamp.on .spot{fill:#ffe9a8}
.bulb{fill:#7d7050}.lamp.on .bulb{fill:#ffe2a0}

<div class="n">Géométrie v16 • nord en haut<br>Positions estimées d'après 7 photos</div></div>

<!-- ouvertures v16 : ouest (salle de jeu, WC, chambre), est (arches salon), nord (salle de bain), sud (entrée) -->
<rect x="-8" y="21" width="16" height="72" fill="#d8d0c4"/><rect x="-8" y="153" width="16" height="64" fill="#d8dde2"/><rect x="-3" y="21" width="6" height="72" fill="#3a3d42"/><rect x="-3" y="153" width="6" height="64" fill="#3a3d42"/>

<script>
window.RM=window.RM||{};
window.RM.setLight=function(id,on,br,rgb){var g=document.getElementById(id);if(!g)return;g.classList.toggle('on',!!on);g.querySelectorAll('.halo').forEach(function(h){h.style.opacity=on?(br==null?'':br):'';if(rgb){var m=/#[\w-]+/.exec(h.getAttribute('fill'));document.querySelectorAll(m[0]+' .s').forEach(function(s){s.setAttribute('stop-color','rgb('+rgb.join(',')+')')})}})};
document.querySelectorAll('.lamp').forEach(function(g){g.addEventListener('click',function(){g.classList.toggle('on');g.querySelectorAll('.halo').forEach(function(h){h.style.opacity=''})})});
</script></body></html>
